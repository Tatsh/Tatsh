---
concurrency:
  cancel-in-progress: false
  group: '${{ github.workflow }}-${{ github.ref }}'
  queue: 'max'
jobs:
  github-metrics:
    name: Update metrics
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
        with:
          base: header, activity, community, repositories, metadata
          clean_workflows: failure, startup_failure, cancelled
          config_timezone: America/New_York
          delay: 1
          filename: github-metrics.svg
          # The action commits the SVG without a trailing newline; the steps below commit it.
          output_action: none
          plugin_achievements: 'no'
          plugin_followup: 'yes'
          plugin_habits: 'yes'
          plugin_habits_charts: 'no'
          plugin_habits_facts: 'yes'
          plugin_introduction: 'yes'
          plugin_introduction_title: 'yes'
          plugin_isocalendar: 'yes'
          plugin_isocalendar_duration: full-year
          plugin_languages: 'yes'
          plugin_languages_colors: rainbow
          plugin_languages_ignored: html, css, less, dockerfile
          plugin_languages_limit: 5
          plugin_languages_threshold: 0%
          plugin_lines: 'yes'
          plugin_repositories: 'yes'
          plugin_repositories_starred: 1
          template: classic
          token: ${{ secrets.METRICS_TOKEN }}
          use_prebuilt_image: 'yes'
          user: Tatsh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Commit metrics with a trailing newline
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cp /metrics_renders/github-metrics.svg github-metrics.svg
          [ -n "$(tail -c 1 github-metrics.svg)" ] && echo >> github-metrics.svg
          git diff --quiet -- github-metrics.svg && exit 0
          git config user.name Tatsh
          git config user.email 724848+Tatsh@users.noreply.github.com
          git commit -m '🥳 Welcome aboard, deploy completed.' -- github-metrics.svg
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}" HEAD
name: Metrics
'on':
  schedule: [{ cron: '* 12 * * *' }]
permissions: {}
